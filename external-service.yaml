apiVersion: v1
kind: Service
metadata:
  name: ai-model-service
spec:
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
---
apiVersion: v1
kind: Endpoints
metadata:
  name: ai-model-service
subsets:
  - addresses:
      - ip: 172.28.208.1  # 윈도우 WSL 게이트웨이 IP
    ports:
      - port: 5000