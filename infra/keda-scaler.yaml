apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: ticketbench-ai-scaler
spec:
  scaleTargetRef:
    name: ticketbench-deploy
  minReplicaCount: 1
  maxReplicaCount: 25
  
  pollingInterval: 5
  cooldownPeriod: 10

  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
          - type: Pods
            value: 40  
            periodSeconds: 5
          - type: Percent
            value: 900 
            periodSeconds: 5
          selectPolicy: Max
        scaleDown:
          stabilizationWindowSeconds: 10
          policies:
          - type: Percent
            value: 100 
            periodSeconds: 15
  
  triggers:
  - type: metrics-api
    metadata:
      targetValue: "1"
      # Rendered by scripts/switch_scaler.sh from the AI_SERVER_URL env var, e.g.
      #   export AI_SERVER_URL=https://<your-ngrok-subdomain>.ngrok-free.dev
      url: "AI_SERVER_URL_PLACEHOLDER/api/v1/predict"
      valueLocation: "predicted_replicas"
      timeout: "5000"
